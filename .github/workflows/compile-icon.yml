name: Compile App Icon

on:
  workflow_dispatch: {}
  push:
    paths:
      - "Resources/Assets.xcassets/**"
      - ".github/workflows/compile-icon.yml"

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Generate carrier Xcode project with xcodegen
        run: |
          which xcodegen || brew install xcodegen
          mkdir -p IconBuild/Stub
          cat > IconBuild/Stub/main.swift <<'EOF'
          print("icon carrier stub")
          EOF
          cat > IconBuild/project.yml <<'EOF'
          name: IconCarrier
          targets:
            IconCarrier:
              type: application
              platform: macOS
              deploymentTarget: "13.0"
              sources:
                - Stub
              resources:
                - ../Resources/Assets.xcassets
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: de.extragroup.iconcarrier
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGNING_ALLOWED: NO
                  GENERATE_INFOPLIST_FILE: YES
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
          EOF
          cd IconBuild && xcodegen generate
          find . -maxdepth 3

      - name: Build carrier app with xcodebuild
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project IconBuild/IconCarrier.xcodeproj \
            -scheme IconCarrier \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-log.txt

      - name: Extract compiled icon assets
        run: |
          APP="build/DerivedData/Build/Products/Release/IconCarrier.app"
          echo "--- app bundle contents ---"
          find "$APP"
          mkdir -p build/output
          cp "$APP/Contents/Resources/Assets.car" build/output/Assets.car
          cp "$APP/Contents/Info.plist" build/output/Info-merged.plist
          echo "--- merged Info.plist ---"
          plutil -p "$APP/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-app-icon
          path: |
            build/output/Assets.car
            build/output/Info-merged.plist
            build/xcodebuild-log.txt
          if-no-files-found: warn
